# Dedicated CI for PT2E (PyTorch 2 Export) quantization tests on ROCm.
#
# Why this workflow exists separately from regression_test_pt2e_gpu.yml:
#   ROCm self-hosted runners authenticate to AWS (ECR) via GitHub OIDC. Fork
#   PRs do not get an OIDC id-token, so pull_request-triggered ROCm jobs fail
#   auth. Other ROCm workflows use the ciflow/rocm label/tag path instead;
#   this file matches that pattern. CUDA PT2E stays on pull_request in
#   regression_test_pt2e_gpu.yml.
#
# Slow x86 tests are excluded here:
#   test_x86inductor_fusion.py and test_x86inductor_quantizer.py hardcode
#   device="cpu" and gate on CPU ISA features. They self-skip on ROCm anyway
#   (skipIf(torch.version.hip is not None)); regression_test_pt2e_cpu.yml owns
#   them.
name: Run PT2E ROCm Tests

on:
  push:
    branches:
      - main
    tags:
      - ciflow/rocm/*

concurrency:
  group: regression_test-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_number || github.ref }}
  cancel-in-progress: true

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  test-rocm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ROCM Nightly
            runs-on: linux.rocm.gpu.ecosystem.mi350.1
            torch-spec: '--pre torchvision torch --index-url https://download.pytorch.org/whl/nightly/rocm10.0'
            gpu-arch-type: "rocm"
            gpu-arch-version: "10.0"
            docker-image: pytorch/manylinux2_28-builder:rocm10.0

    permissions:
      id-token: write
      contents: read
    uses: pytorch/test-infra/.github/workflows/linux_job_v2.yml@main
    with:
      timeout: 120
      no-sudo: ${{ matrix.gpu-arch-type == 'rocm' }}
      runner: ${{ matrix.runs-on }}
      gpu-arch-type: ${{ matrix.gpu-arch-type }}
      gpu-arch-version: ${{ matrix.gpu-arch-version }}
      docker-image: ${{ matrix.docker-image }}
      submodules: recursive
      script: |
        conda create -n venv python=3.11 -y
        conda activate venv
        python -m pip install --upgrade pip
        pip install ${{ matrix.torch-spec }}
        pip install uv==0.13.7
        uv pip install -r dev-requirements.txt
        pip install . --no-build-isolation
        export CONDA=$(dirname $(dirname $(which conda)))
        export LD_LIBRARY_PATH=$CONDA/lib/:$LD_LIBRARY_PATH
        # Run PT2E tests, excluding the slow CPU-only x86 Inductor tests (they
        # are owned by regression_test_pt2e_cpu.yml).
        pytest test/quantization/pt2e --verbose -n 8 --dist=worksteal --durations=25 \
          --ignore=test/quantization/pt2e/test_x86inductor_fusion.py \
          --ignore=test/quantization/pt2e/test_x86inductor_quantizer.py

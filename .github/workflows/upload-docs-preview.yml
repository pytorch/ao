name: Upload docs preview

# Runs in the base-repo context so it has the AWS credentials needed to write
# to s3://doc-previews. The Build Docs job stages the rendered docs as a GHA
# artifact; a fork PR cannot authenticate via OIDC from that job, so the upload
# happens here instead.

on:
  workflow_run:
    workflows:
      - Build Docs
    types:
      - completed

permissions:
  id-token: write
  contents: read
  actions: read
  pull-requests: write

jobs:
  upload-docs-preview:
    if: >-
      github.repository_owner == 'pytorch' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Download docs preview artifact
        id: download
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: docs-preview
          path: docs-preview-staging
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read PR metadata
        if: steps.download.outcome == 'success'
        id: metadata
        run: |
          set -eu
          meta="docs-preview-staging/pr-metadata.txt"
          if [ ! -f "${meta}" ]; then
            echo "pr-metadata.txt missing from artifact, aborting."
            exit 1
          fi
          # The artifact comes from the PR head, so treat its contents as
          # untrusted: anything but a plain integer could escape the S3 prefix.
          PR_NUMBER="$(grep -m1 '^PR_NUMBER=' "${meta}" | cut -d= -f2- || true)"
          if ! [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "PR_NUMBER is not a positive integer, aborting."
            exit 1
          fi
          echo "pr_number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"

      - name: Configure AWS credentials
        if: steps.download.outcome == 'success'
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: arn:aws:iam::308535385114:role/arc
          aws-region: us-east-1
          role-session-name: docs-preview-uploader

      - name: Upload docs preview
        if: steps.download.outcome == 'success'
        env:
          PR_NUMBER: ${{ steps.metadata.outputs.pr_number }}
        run: |
          aws s3 sync docs-preview-staging/content/ "s3://doc-previews/pytorch/ao/${PR_NUMBER}" --quiet
